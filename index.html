<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCost</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="toolbar">
        <div class="logo">AutoCost</div>
        <div>
            <a href="#" class="toolbar-item" id="home-link">Home</a>
            <a href="#" class="toolbar-item">About</a>
            <a href="#" class="toolbar-item">Contact</a>
        </div>
    </div>
    <div id="home-section">
        <h1>Welcome to AutoCost!</h1>
        <p>This is the home section where you can learn about calculating car costs and managing your vehicle expenses.</p>
    </div>
    <div class="contact-box" id="contact-box">
        <h2>Contact Us</h2>
        <form id="contact-form">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="description">Description of the Problem:</label>
            <textarea id="description" name="description" rows="5" required></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
